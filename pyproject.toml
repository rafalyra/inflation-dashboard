[project]
name = "inflation-dashboard"
version = "0.1.0"
description = "Pipeline that fetches, validates and exports official consumer-inflation data."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "pandas>=2.2",
    "pyarrow>=18",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    # zoneinfo needs the IANA database; Windows doesn't ship one.
    "tzdata>=2024.1",
]

[project.scripts]
inflation = "inflation.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inflation"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
