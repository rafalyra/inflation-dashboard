# Everything a human adjusts without touching code (SPEC §8).
# Countries are added here phase by phase; only enabled countries are processed and shown.

site:
  locales: [en, pt-BR]
  # Language for pages that aren't tied to one country (Overview, Learn, Methodology).
  # Brazil is the only country in Phases 1–2, so the site starts in Portuguese.
  default_locale: pt-BR

countries:
  br:
    enabled: true
    name:
      en: Brazil
      pt-BR: Brasil
    # Language a visitor sees first on this country's page (they can switch).
    default_locale: pt-BR
    timezone: America/Sao_Paulo
    currency: BRL
    # CSS design token for this country's accent color (defined in web/src/styles/tokens.css).
    color_token: country-br
    # CMN target for IPCA: 3% with ±1.5 pp tolerance (SPEC §6.1).
    target:
      target_pct: 3.0
      band_low_pct: 1.5
      band_high_pct: 4.5
    # Continuous target since 2025: missed after this many consecutive months outside the band.
    months_outside_band_for_miss: 6
    # Focus median over the last 30 days (the published report's figure). The 5-day
    # median (bcb_focus_5d) is shown as secondary.
    primary_expectation_source: bcb_focus_30d
    # Core measures averaged on the Brazil page (SPEC §6.1 default). Each name maps to the
    # catalog series br.core.<name in lower case>, e.g. EX0 → br.core.ex0.
    core_set: [EX0, EX3, MS, DP, P55]
    chart_start_year: 2010
    # Which catalog series play each role on the country page.
    series:
      headline: br.ipca.headline
      preview: br.ipca15.headline
      diffusion: br.ipca.diffusion
      policy_rate: br.policy.selic_target
      fx: br.fx.usdbrl
    # Page palette drawn from the flag (forest green, gold, navy, white), in muted tones.
    # `series` is the chart order: the validated categorical hues, reordered so blue,
    # green and gold come first; this order passed the colorblind checks in both modes
    # (scripts in docs/methodology.md, "Chart colors").
    theme:
      light:
        bg: "#f3f6f1"
        surface: "#ffffff"
        surface_muted: "#e7eee6"
        border: "#cfdacd"
        text: "#142019"
        text_muted: "#4f5d54"
        link: "#1f4f8a"
        header_bg: "#14583a"
        header_text: "#ffffff"
        accent: "#b88a1b"
        band: "rgba(20, 88, 58, 0.10)"
        series: ["#2a78d6", "#008300", "#eda100", "#e87ba4", "#6250d6", "#eb6834", "#1baf7a", "#e34948"]
      dark:
        bg: "#0d1511"
        surface: "#142019"
        surface_muted: "#1b2a21"
        border: "#2a3b30"
        text: "#e7efe8"
        text_muted: "#9fb0a4"
        link: "#8fb4e8"
        header_bg: "#0f3a27"
        header_text: "#f2f5f0"
        accent: "#d4ad45"
        band: "rgba(122, 190, 150, 0.12)"
        series: ["#3987e5", "#008300", "#c98500", "#d55181", "#9085e9", "#d95926", "#199e70", "#e66767"]
    # Country-specific comparison panels: each lists series shown side by side (12-month rates).
    panels:
      free_vs_administered: [br.ipca.free, br.ipca.administered]
      # BCB Technical Note 57 pair, built the same way so the comparison is like-for-like.
      services_vs_goods: [br.core.ex3_services, br.core.ex3_industrial]
